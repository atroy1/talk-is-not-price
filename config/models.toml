# Model routing for every LLM call outside the market simulator. Read by tools/llm.py.
# The simulator (vendor/llm-agent-collusion) keeps its own wrappers; docs/MODEL-ROUTING.md says which model plays which agent.
# Prices: USD per 1M tokens [input, output]. OpenRouter ids and prices checked against its live list 2026-10-20; Anthropic list prices 10/16. Recheck Thu Oct 22.

[lanes.local]
# The Qwen arm only (10/22: local exists for research levers, not for daytime jobs). The stock Qwen3.5 35B-A3B
# mlx_lm server on the Studio, up during the sprint (make studio-qwen). "default_model" = whatever it was started with.
kind = "openai"
base_url_env = "QWEN_BASE_URL"         # http://arthurs-mac-studio.local:8083/v1
key_env = "QWEN_API_KEY"               # ignored by the server; any string
default_model = "default_model"
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[lanes.claude]
kind = "anthropic"
key_env = "ANTHROPIC_API_KEY"
default_model = "claude-haiku-5-5"

[lanes.openrouter]
kind = "openai"
base_url = "https://openrouter.ai/api/v1"
key_env = "OPENROUTER_API_KEY"
default_model = "deepseek/deepseek-v4.1-flash"
# provider fallbacks off: a silent substitution would log one model's behaviour under another's name
extra_body = { provider = { allow_fallbacks = false }, reasoning = { enabled = false } }  # reasoning off: see docs/MODEL-ROUTING.md 5b

[prices]
"claude-haiku-5-5" = [0.10, 0.50]
"claude-sonnet-5-5" = [2.0, 10.0]
"claude-opus-5-5" = [4.0, 20.0]
"claude-fable-5-1" = [10.0, 50.0]
"deepseek/deepseek-v4.1-flash" = [0.028, 0.12]   # OpenRouter listing 2026-10-20
"openai/gpt-6-luna" = [0.10, 0.50]
"google/gemini-2.5-flash-lite" = [0.10, 0.40]
"local/qwen35-9b-stock" = [0.0, 0.0]        # Studio, free
"local/qwen35-9b-abl" = [0.0, 0.0]
"local/qwen35-35b-stock" = [0.0, 0.0]
"local/qwen35-35b-abl" = [0.0, 0.0]
"local/qwen35-35b-steer" = [0.0, 0.0]
"local/qwen/qwen3.5-9b" = [0.0, 0.0]
"local/qwen/qwen3.8-27b" = [0.0, 0.0]
"anthropic/claude-haiku-5.5" = [0.10, 0.50]   # OpenRouter route to Claude, same list price
"anthropic/claude-sonnet-5.5" = [2.0, 10.0]
"gpt-4.1-mini" = [0.40, 1.60]              # the starter's per-run judge, OpenAI direct
"openai/gpt-4.1-mini" = [0.40, 1.60]       # same judge via OpenRouter

# ---- tasks: lane, model (else the lane default), limits, optional "lane:model" fallback ----

[tasks.talk_notes]
lane = "claude"
model = "claude-haiku-5-5"   # 10/22: notes are optional; an online transcript service is fine too
max_tokens = 1500
temperature = 0.2
purpose = "Claims, numbers and open problems with timestamps from one transcript chunk"

[tasks.slide_ocr]
lane = "claude"
model = "claude-haiku-5-5"             # 10/22: off the local lane
max_tokens = 600
purpose = "Text and the one takeaway of a slide frame"

# [tasks.label_message] retired 10/22: the local 9B second labeller was a convenience, not a research lever.
# The graded DeepSeek labels are checked against the Sonnet sample and the 40 hand labels instead.

[tasks.label_scored]
lane = "openrouter"
model = "deepseek/deepseek-v4.1-flash"
max_tokens = 3
temperature = 0.0
top_logprobs = 5
provider = { order = ["nebius/fp8"], allow_fallbacks = false }  # one host, 8-bit, returns probabilities (CoreWeave 2026-10-21; moved to Nebius 2026-10-23 when CoreWeave was rate-limited upstream)
purpose = "Graded words score: P(FLOOR), P(AGREE), P(NEITHER) from the first answer token's probabilities; a continuous score the fixed false-alarm threshold can cut. About $0.30 for all 9,654 seller messages on this host"
# Jev is NOT used: OpenRouter's only listing, typesafe/jev-router, forwards each request to a model it chooses,
# so the labeller would change under us and could not be named in Methods. Checked 2026-10-21.

[tasks.label_alt]
lane = "openrouter"
model = "openai/gpt-4.1-mini"   # second labeller family for the robustness row (Sat 10/24 night); hard answer, probabilities if the host returns them
max_tokens = 3
temperature = 0
# no top_logprobs: OpenRouter has no gpt-4.1-mini endpoint that returns them (404, Sat 10/24); hard answer only

[tasks.judge_sample]
lane = "claude"
model = "claude-sonnet-5-5"
max_tokens = 1500  # was 40: Sonnet 5.5 thinks by default and ran out of tokens on longer messages (10/23)
purpose = "Reference label on the stratified validation sample (agreement with the local labels goes in Methods)"

[tasks.critique]
lane = "claude"
model = "claude-opus-5-5"
max_tokens = 2000
purpose = "Rubric critique of a draft section; prefer doing this in Claude Code on the plan, which costs no credit"

[tasks._ping]
lane = "local"
max_tokens = 5
temperature = 0.0
purpose = "Connectivity check"

[tasks._selftest]
lane = "local"
model = "does-not-exist"
max_tokens = 5
fallback = "local:fake-model"
purpose = "Exercises the fallback path against the fake server"
