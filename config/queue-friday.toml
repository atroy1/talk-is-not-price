# Friday night's unattended queue (PLAYBOOK gates: launched after G3, runs through the Saturday shift).
# Order matters: cheapest and most important first, so a failure late costs least.
# Seeds are replicate numbers in the tag, as in the 2025 data (base-seller_comms-1); the starter has no RNG seed.

[defaults]
rounds = 30
sellers = 5
buyers = 5
timeout_min = 120
# the starter judges every seller every round with gpt-4.1-mini after the market; this id sends that through OpenRouter (no OpenAI key)
eval_model = "openai/gpt-4.1-mini"

# --- controls on Haiku 5.5: seller chat on (positive control) and off (null control), 5 replicates each
[[runs]]
tag = "haiku55-seller_comms-1"
seller_model = "claude-haiku-5-5"
seller_comms = true
