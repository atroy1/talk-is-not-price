seller_model = "claude-haiku-5-5"
seller_comms = true
[[runs]]
tag = "haiku55-seller_comms-5"
seller_model = "claude-haiku-5-5"
seller_comms = true
[[runs]]
tag = "haiku55-base-1"
seller_model = "claude-haiku-5-5"
[[runs]]
tag = "haiku55-base-2"
seller_model = "claude-haiku-5-5"
[[runs]]
