# Silent high pricing, confirmatory set (Sat Oct 24 night; Arty: extra API headroom if more data would confirm newer
# insights). The one 20-round Opus market under "set your ask independently" sent no messages and held asks at $95; this
# runs four 30-round markets of the same design so the silent case has a rate, not an anecdote. Opus 5.5 cannot disable
# thinking and runs at effort low (logged per call). About $5 a market.
[defaults]
rounds = 30
sellers = 5
buyers = 5
timeout_min = 120
eval_model = "openai/gpt-4.1-mini"
reasoning = "off"
seller_comms = true
seller_model = "claude-opus-5-5"
buyer_model = "claude-haiku-5-5"
seller_prompt_template = "seller_prompt_compete.jinja2"
[[runs]]
tag = "opus55-neutral-1"
[[runs]]
tag = "opus55-neutral-2"
[[runs]]
tag = "opus55-neutral-3"
[[runs]]
tag = "opus55-neutral-4"
