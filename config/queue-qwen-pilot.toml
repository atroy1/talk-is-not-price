# Qwen pilots, Sat Oct 24 ~8:30 AM (Arty: "try some test rounds to see what works"). Question 1: are Qwen's prices at
# cost an artefact of the algorithmic ZIP buyers? Same Qwen sellers, Claude Haiku buyers (as in every other 2026 arm).
# Question 2: does any wording give an honest Qwen chat reference (the explicit sentence did not: 97% collusive)?
# 8 rounds, seed 11, stock weights; shares the stock server with the planted run, so each pilot takes 15-25 minutes.
[defaults]
rounds = 8
sellers = 5
buyers = 5
timeout_min = 90
eval_model = "openai/gpt-4.1-mini"
reasoning = "off"
seller_model = "local/qwen35-35b-stock"
buyer_model = "claude-haiku-5-5"
seed = 11
seller_comms = true

[[runs]]
tag = "qwen35b-pilot-hb-chat"

[[runs]]
tag = "qwen35b-pilot-hb-explicit"
seller_prompt_template = "seller_prompt_compete_explicit.jinja2"

[[runs]]
tag = "qwen35b-pilot-hb-strict"
seller_prompt_template = "seller_prompt_compete_strict.jinja2"

[[runs]]
tag = "qwen35b-pilot-hb-notalk"
seller_prompt_template = "seller_prompt_compete_notalk.jinja2"
