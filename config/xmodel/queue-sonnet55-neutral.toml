# EXPLORATORY model sample, Fri Oct 23 ~3:05 PM (post-lock), on Arty's ask: does the seller model change how
# each instruction works? 20 rounds, Haiku buyers in every market so only the sellers differ. Reasoning "off":
# Haiku and Sonnet 5.5 run without thinking; Opus 5.5 cannot disable thinking and runs at effort low (logged per call).
[defaults]
rounds = 20
sellers = 5
buyers = 5
timeout_min = 90
eval_model = "openai/gpt-4.1-mini"
reasoning = "off"
[[runs]]
tag = "xm20-sonnet55-neutral-1"
seller_model = "claude-sonnet-5-5"
buyer_model = "claude-haiku-5-5"
seller_comms = true
seller_prompt_template = "seller_prompt_compete.jinja2"
[[runs]]
tag = "xm20-sonnet55-neutral-2"
seller_model = "claude-sonnet-5-5"
buyer_model = "claude-haiku-5-5"
seller_comms = true
seller_prompt_template = "seller_prompt_compete.jinja2"
