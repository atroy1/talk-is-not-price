# FALLBACK version of the Qwen arm on the 9B pair (use if the 35B pair misbehaves): make studio-mlx-up QWEN=9b,
# then make studio-queue QUEUE=config/queue-qwen9b.toml. Same design as config/queue-qwen.toml.
# Sellers = Qwen3.5 9B, stock vs abliterated (refusal removed), both converted to MLX 4-bit by the same command and
# served by their own mlx_lm servers on the Studio (make studio-mlx-up), which honour seeds: the same seed replays the
# same run exactly. The weights that play a run are the weights whose activations we read afterwards.
# Buyers = the starter's algorithmic ZIP traders, so sellers are the only language models in these markets.
# Temperature 0.7 as in the 2025 runs; thinking off (the starter renders Qwen's template itself).
# About 21 s per seller reply on the Studio's GPU, so about an hour per 30-round run; 11 runs fill the night.
# Order: matched stock/abliterated pairs with a compete run after each, so a short night still leaves usable sets.
# Launch Friday 9:15 PM (after make studio-mlx-up):  make studio-queue QUEUE=config/queue-qwen.toml

[defaults]
rounds = 30
sellers = 5
buyers = 5
timeout_min = 150
eval_model = "openai/gpt-4.1-mini"
reasoning = "off"
zip_buyers = true
seller_comms = true

[[runs]]
tag = "qwen9b-stock-chat-s1"
seller_model = "local/qwen35-9b-stock"
seed = 1

[[runs]]
tag = "qwen9b-abl-chat-s1"
seller_model = "local/qwen35-9b-abl"
seed = 1

