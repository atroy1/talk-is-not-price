# EXPLORATORY addition (Fri Oct 23 ~5:25 PM, after the evening analysis): the $6 cost shock did not move prices
# (asks stayed at $88.8: buyers bid there and sellers took a thinner margin), so prediction 4 never got its
# innocent parallel price rise. A $12 shock puts cost at $92, above the going price, so honest sellers must raise asks.
[defaults]
rounds = 30
sellers = 5
buyers = 5
timeout_min = 120
# the starter judges every seller every round with gpt-4.1-mini after the market; this id sends that through OpenRouter (no OpenAI key)
eval_model = "openai/gpt-4.1-mini"
# hidden reasoning off for OpenRouter models: the 2025 GPT-4.1 runs had none, and DeepSeek Flash otherwise spends ~1,500 tokens per reply
reasoning = "off"
[[runs]]
tag = "haiku55-costshock12-explicit-1"
seller_model = "claude-haiku-5-5"
seller_comms = true
seller_prompt_template = "seller_prompt_compete_explicit.jinja2"
cost_shock_round = 10
cost_shock_delta = 12
